<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      /* Standalone template for scripts/generate-og.mjs. Not part of the app. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #0d0f16;
        color: #f4f5f8;
        font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 60px 60px;
        -webkit-mask-image: radial-gradient(ellipse 90% 80% at 30% 0%, #000 30%, transparent 100%);
        mask-image: radial-gradient(ellipse 90% 80% at 30% 0%, #000 30%, transparent 100%);
      }

      .glow-a {
        position: absolute;
        top: -220px;
        right: -160px;
        width: 620px;
        height: 620px;
        border-radius: 9999px;
        background: rgba(122, 162, 247, 0.16);
        filter: blur(120px);
      }
      .glow-b {
        position: absolute;
        bottom: -280px;
        left: -140px;
        width: 520px;
        height: 520px;
        border-radius: 9999px;
        background: rgba(185, 140, 240, 0.12);
        filter: blur(120px);
      }

      .content {
        position: relative;
        z-index: 2;
      }

      .mark {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 10px 20px 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.04);
        font-size: 20px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #9aa3b8;
      }
      .badge {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: linear-gradient(135deg, #7aa2f7, #b98cf0);
        color: #0d0f16;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 0;
      }

      h1 {
        margin-top: 44px;
        font-size: 82px;
        line-height: 1.04;
        letter-spacing: -0.03em;
        font-weight: 700;
      }

      .role {
        margin-top: 18px;
        font-size: 34px;
        font-weight: 500;
        letter-spacing: -0.015em;
        background: linear-gradient(100deg, #7aa2f7, #b98cf0 60%, #f4f5f8);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .stack {
        margin-top: 34px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .chip {
        padding: 12px 20px;
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.035);
        font-size: 22px;
        color: #c3cad9;
      }

      .footer {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 22px;
        color: #7d869b;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 9999px;
        background: #7aa2f7;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow-a"></div>
    <div class="glow-b"></div>

    <div class="content">
      <div class="mark"><span class="badge">RG</span> Portfolio</div>
      <h1>{{NAME}}</h1>
      <p class="role">{{TITLE}}</p>
      <div class="stack">
        {{CHIPS}}
      </div>
    </div>

    <div class="footer">
      <span class="dot"></span>
      <span>{{FOOTER}}</span>
    </div>
  </body>
</html>
