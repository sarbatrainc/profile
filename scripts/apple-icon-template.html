<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      /* Standalone template for scripts/generate-og.mjs. Not part of the app. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 180px;
        height: 180px;
        background: #0d0f16;
        display: grid;
        place-items: center;
      }
      .mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .layers {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      span.layer {
        display: block;
        height: 13px;
        border-radius: 9999px;
        background: linear-gradient(90deg, #7aa2f7, #b98cf0);
      }
      span.l1 {
        width: 104px;
        opacity: 0.95;
      }
      span.l2 {
        width: 132px;
        opacity: 0.7;
      }
      span.l3 {
        width: 78px;
        opacity: 0.45;
      }
    </style>
  </head>
  <body>
    <div class="mark">
      <div class="layers">
        <span class="layer l1"></span>
        <span class="layer l2"></span>
        <span class="layer l3"></span>
      </div>
    </div>
  </body>
</html>
